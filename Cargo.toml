[package]
name = "herdr-model-capacity"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Account-level model capacity pane for Herdr"

[[bin]]
name = "model-capacity"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"
